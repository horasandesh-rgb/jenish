<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jenish | Welcome</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    background:linear-gradient(135deg,#0f172a,#2563eb);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    color:white;
}
.card{
    width:90%;
    max-width:420px;
    background:rgba(255,255,255,.1);
    padding:30px;
    border-radius:20px;
    text-align:center;
    backdrop-filter:blur(10px);
}
.profile{
    width:120px;
    height:120px;
    border-radius:50%;
    border:4px solid white;
    object-fit:cover;
}
h1{
    margin:15px 0;
}
p{
    margin-bottom:20px;
    line-height:1.6;
}
.btn{
    display:block;
    text-decoration:none;
    color:white;
    background:#2563eb;
    padding:12px;
    border-radius:10px;
    margin:10px 0;
    font-weight:bold;
    transition:.3s;
}
.btn:hover{
    background:#1d4ed8;
}
.footer{
    margin-top:20px;
    font-size:14px;
    opacity:.8;
}
</style>
</head>

<body>

<div class="card">

<img class="profile" src="https://via.placeholder.com/120" alt="Profile">

<h1>👋 Hi, I'm Jenish</h1>

<p>
Welcome to my personal website.<br><br>
📍 From: Arunkhola, Nawalpur, Nepal<br>
💻 Learning Web Development<br>
🚀 Future Full-Stack Developer
</p>

<a class="btn" href="https://facebook.com/" target="_blank">📘 Facebook</a>

<a class="btn" href="https://instagram.com/" target="_blank">📸 Instagram</a>

<a class="btn" href="https://wa.me/" target="_blank">💬 WhatsApp</a>

<div class="footer">
Thanks for visiting ❤️
</div>

</div>

</body>
</html>
